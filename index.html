    function loadState() {

        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return createInitialState();
        const parsed = JSON.parse(raw);
        const base = createInitialState();
        // マージして欠損キーを安全に補完
        const mergedExams = { ...base.exams };
        if (parsed.exams && typeof parsed.exams === 'object') {
          Object.keys(mergedExams).forEach(id => {
            if (parsed.exams[id]) {
              mergedExams[id] = { ...mergedExams[id], ...parsed.exams[id] };
            }
          });
        }
        return {
          version: 2,
          exams: mergedExams,
          subjects: Array.isArray(parsed.subjects) ? parsed.subjects.map(s => ({
            id: s.id || uid('sub'),
            name: String(s.name || '名称未設定'),

    /* =========================================================================
       3. ユーティリティ関数（日付・ID・エスケープ・進捗計算）
       ========================================================================= */
    function uid(prefix = 'id') {
      return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
    }

    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTodayStr() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function parseLocalDate(dateStr) {
      if (!dateStr || !/^\d{4}-\d{2}-\d{2}$/.test(dateStr)) return null;
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function getDaysUntil(dateStr) {
      const target = parseLocalDate(dateStr);
      if (!target) return null;
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const diffMs = target.getTime() - today.getTime();
      return Math.ceil(diffMs / (1000 * 60 * 60 * 24));
    }

    function formatDateJP(dateStr) {
      const d = parseLocalDate(dateStr);
      if (!d) return '日程未定';
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${weekdays[d.getDay()]})`;
    }

    function formatDateShort(dateStr) {
      const d = parseLocalDate(dateStr);
      if (!d) return '未定';
      const weekdays = ['日', '月', '火', '水', '木', '金', '土'];
      return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}(${weekdays[d.getDay()]})`;
    }

    /**
     * 科目の実効達成数・目標数を算出（章が存在する場合は各章の合計を自動合算）
     */
    function getSubjectStats(subject) {
      if (subject.chapters && subject.chapters.length > 0) {
        const target = subject.chapters.reduce((sum, ch) => sum + Math.max(1, Number(ch.target) || 1), 0);
        const done = subject.chapters.reduce((sum, ch) => sum + Math.max(0, Math.min(Number(ch.done) || 0, Number(ch.target) || 1)), 0);
        const pct = target > 0 ? Math.min(100, Math.round((done / target) * 100)) : 0;
        return { done, target, pct, hasChapters: true };
      }
      const target = Math.max(1, Number(subject.target) || 1);
      const done = Math.max(0, Math.min(Number(subject.done) || 0, target));
      const pct = Math.min(100, Math.round((done / target) * 100));
      return { done, target, pct, hasChapters: false };
    }

    /**
     * 日別学習ログに差分を加算（今日・1週間・1ヶ月達成数の計算用）
     */
    function recordDailyDelta(delta) {
      if (!delta) return;
      const key = getTodayStr();
      const prev = Number(appState.dailyLogs[key]) || 0;
      const next = Math.max(0, prev + delta);
      if (next === 0) {
        delete appState.dailyLogs[key];
      } else {
        appState.dailyLogs[key] = next;
      }
    }

    /**
     * 直近N日間の学習達成ログ合計を取得
     */
    function getLoggedSumInDays(days) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      let sum = 0;
      Object.entries(appState.dailyLogs || {}).forEach(([dateKey, val]) => {
        const d = parseLocalDate(dateKey);
        if (!d) return;
        const diffDays = Math.floor((today.getTime() - d.getTime()) / (1000 * 60 * 60 * 24));
        if (diffDays >= 0 && diffDays < days) {
          sum += Number(val) || 0;
        }
      });
      return sum;
    }

    /**
     * 志望区分のうち最も近い確定1次試験を取得（なければ目標基準日を使用）
     */
    function getNearestConfirmedTargetExam() {
      const candidates = EXAM_MASTER
        .map(m => ({ master: m, user: appState.exams[m.id] }))
        .filter(item => item.user && item.user.isTarget && item.user.firstExamDate)
        .map(item => ({ ...item, daysLeft: getDaysUntil(item.user.firstExamDate) }))
        .filter(item => item.daysLeft !== null && item.daysLeft >= 0)
        .sort((a, b) => a.daysLeft - b.daysLeft);
      return candidates[0] || null;
    }

    /**
     * 確定済み志望試験同士の1次試験日重複チェック
     */
    function getDuplicateDateAlerts() {
      const dateMap = {};
      EXAM_MASTER.forEach(m => {
        const u = appState.exams[m.id];
        if (!u || !u.isTarget || !u.firstExamDate) return; // 未定(TBD)は対象外
        if (!dateMap[u.firstExamDate]) dateMap[u.firstExamDate] = [];
        dateMap[u.firstExamDate].push(m.shortName);
      });
      return Object.entries(dateMap)
        .filter(([, names]) => names.length >= 2)
        .sort(([a], [b]) => a.localeCompare(b))
        .map(([date, names]) => ({ date, names }));
    }

    /**
     * 全体進捗＆期間別ノルマ自動換算（今日・1週間・1ヶ月・試験日まで）
     */
    function computeOverallProgressAndQuotas() {
      let totalTarget = 0;
      let totalDone = 0;
      appState.subjects.forEach(s => {
        const st = getSubjectStats(s);
        totalTarget += st.target;
        totalDone += st.done;
      });
      const remaining = Math.max(0, totalTarget - totalDone);
      const totalPct = totalTarget > 0 ? Math.min(100, Math.round((totalDone / totalTarget) * 100)) : 0;

      const nearest = getNearestConfirmedTargetExam();
      const goalDateStr = nearest ? nearest.user.firstExamDate : appState.fallbackGoalDate;
      const goalLabel = nearest ? `${nearest.master.shortName}（1次）` : '設定目標日';
      const rawDaysLeft = getDaysUntil(goalDateStr);
      const daysLeft = rawDaysLeft !== null ? Math.max(1, rawDaysLeft) : 180;

      // 今日の達成数・直近7日・直近30日
      const todayDone = Number(appState.dailyLogs[getTodayStr()]) || 0;
      const weekDone = getLoggedSumInDays(7);
      const monthDone = getLoggedSumInDays(30);

      // ノルマ計算（今日の達成分も母数に含めることで、今日進めたときにバーが着実に伸びる設計）
      const remStartOfToday = remaining + todayDone;
      const dailyQuota = remStartOfToday > 0 ? Math.ceil(remStartOfToday / daysLeft) : 0;

      const weeksLeft = Math.max(1, daysLeft / 7);
      const remStartOfWeek = remaining + weekDone;
      const weeklyQuota = remStartOfWeek > 0 ? Math.ceil(remStartOfWeek / weeksLeft) : 0;

      const monthsLeft = Math.max(1, daysLeft / 30);
      const remStartOfMonth = remaining + monthDone;
      const monthlyQuota = remStartOfMonth > 0 ? Math.ceil(remStartOfMonth / monthsLeft) : 0;

      return {
        totalTarget,
        totalDone,
        remaining,
        totalPct,
        goalDateStr,
        goalLabel,
        rawDaysLeft,
        daysLeft,
        today: {
          done: todayDone,
          quota: dailyQuota,
          pct: dailyQuota > 0 ? Math.min(100, Math.round((todayDone / dailyQuota) * 100)) : (totalDone > 0 ? 100 : 0)
        },
        week: {
          done: weekDone,
          quota: weeklyQuota,
          pct: weeklyQuota > 0 ? Math.min(100, Math.round((weekDone / weeklyQuota) * 100)) : (totalDone > 0 ? 100 : 0)
        },
        month: {
          done: monthDone,
          quota: monthlyQuota,
          pct: monthlyQuota > 0 ? Math.min(100, Math.round((monthDone / monthlyQuota) * 100)) : (totalDone > 0 ? 100 : 0)
        }
      };
    }

    /**
     * 志望試験の対象科目名セットを取得
     */
    function getTargetExamSubjectNameSet() {
      const set = new Set();
      const targetIds = EXAM_MASTER.filter(m => appState.exams[m.id]?.isTarget).map(m => m.id);
      SUBJECT_MATRIX_DEF.forEach(row => {
        const needed = targetIds.some(id => row.map[id] && row.map[id] !== 'none');
        if (needed) set.add(row.name);
      });
      return set;
    }

    /**
     * バックアップリマインダー表示判定
     */
    function shouldShowBackupReminder() {
      if (uiState.dismissedBackupBanner) return false;
      const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
      if (appState.lastBackupAt) {
        const elapsed = Date.now() - new Date(appState.lastBackupAt).getTime();
        return elapsed >= sevenDaysMs;
      }
      // 未バックアップの場合：何らかの進捗・予定・日程編集があれば通知（初期状態0のときは出さない）
      const hasProgress = appState.subjects.some(s => getSubjectStats(s).done > 0 || (s.chapters && s.chapters.length > 0));
      const hasEvents = appState.myEvents.length > 0;
      return hasProgress || hasEvents || appState.hasEditedSchedule;
    }

    /* =========================================================================

       ========================================================================= */
    function exportBackupJson() {
      try {
        appState.lastBackupAt = new Date().toISOString();
        uiState.dismissedBackupBanner = false;
        saveState();
        const dataStr = JSON.stringify(appState, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const stamp = getTodayStr().replace(/-/g, '');
        a.href = url;
        a.download = `komuin_navi_backup_${stamp}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        showToast('バックアップファイルを保存しました');
        renderApp();
      } catch (e) {
        console.error(e);
        showToast('バックアップ保存に失敗しました', 'error');
      }
    }

    document.getElementById('importFileInput').addEventListener('change', (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result));
          if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.subjects) || !parsed.exams) {
            showToast('対応していないバックアップファイル形式です', 'error');
            return;
          }
          openConfirmModal({
            title: 'バックアップを復元しますか？',
            message: `選択したファイル「${file.name}」の内容で現在のデータを上書き復元します。\nよろしいですか？`,
            confirmLabel: '復元する',
            onConfirm: () => {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed));
              appState = loadState();
              saveState();
              showToast('データを正常に復元しました');
              renderApp();
            }
          });
        } catch (err) {
          showToast('JSONファイルの読み込みに失敗しました', 'error');
        }
      };
      reader.readAsText(file);
    });

          <div class="mt-4 pt-3.5 border-t border-white/15 flex items-center justify-between text-[11px] text-blue-100/90">
            <span>全体達成率：<strong>${q.totalPct}%</strong>（${q.totalDone}/${q.totalTarget}）</span>
            <button type="button" data-goto="study" class="goto-tab-btn font-bold text-white underline underline-offset-2 hover:text-blue-200">学習を記録 →</button>
          </div>
        </section>
      ` : `
        <section class="bg-gradient-to-br from-navy-900 to-navy-700 text-white rounded-3xl p-5 shadow-md">
          <span class="inline-flex items-center text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-white/15 text-blue-100">確定済みの志望試験なし</span>
          <h2 class="text-base font-bold mt-2">志望試験の日程を確認・設定しましょう</h2>
          <p class="text-xs text-blue-200 mt-1 leading-relaxed">日程未定（TBD）の自治体は受験案内が公開され次第、日程タブから日付を入力するとカウントダウンが始まります。</p>
          <div class="mt-3.5 flex gap-2">
            <button type="button" data-goto="schedule" class="goto-tab-btn px-3.5 py-2 rounded-xl bg-blue-500 hover:bg-blue-400 text-white text-xs font-bold">日程を確認・編集</button>
            <button type="button" data-goto="settings" class="goto-tab-btn px-3.5 py-2 rounded-xl bg-white/15 hover:bg-white/25 text-white text-xs font-bold">志望区分を選ぶ</button>
          </div>
        </section>
      `;

      // カテゴリ別進捗サマリー（教養・専門）
      const catSummary = ['教養', '専門'].map(cat => {
        const subs = appState.subjects.filter(s => s.category === cat);
        let done = 0, target = 0;
        subs.forEach(s => {
          const st = getSubjectStats(s);
          done += st.done;
          target += st.target;
        });
        const pct = target > 0 ? Math.min(100, Math.round((done / target) * 100)) : 0;
        return { cat, count: subs.length, done, target, pct };
      });

      return `
        <div class="space-y-4">
          ${backupReminderHtml}
          ${duplicateHtml}
          ${countdownHero}
          ${renderPeriodQuotaCard(q)}

          <!-- 教養・専門カテゴリ別サマリー -->
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-bold text-navy-900">分野別進捗バランス</h2>
              <button type="button" data-goto="study" class="goto-tab-btn text-xs font-semibold text-blue-600 hover:underline">科目一覧へ</button>
            </div>
            <div class="grid grid-cols-2 gap-3">
              ${catSummary.map(c => `
                <div class="rounded-2xl border border-slate-100 bg-slate-50/70 p-3">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-bold text-slate-700">${c.cat}科目</span>
                    <span class="text-xs font-extrabold ${c.cat === '教養' ? 'text-blue-600' : 'text-indigo-600'}">${c.pct}%</span>
                  </div>
                  <p class="text-[11px] text-slate-500 mt-1">${c.done.toLocaleString()} / ${c.target.toLocaleString()}（${c.count}科目）</p>
                  <div class="w-full h-1.5 bg-slate-200 rounded-full overflow-hidden mt-2">
                    <div class="${c.cat === '教養' ? 'bg-blue-600' : 'bg-indigo-600'} h-full rounded-full transition-all" style="width:${c.pct}%"></div>
                  </div>
                </div>
              `).join('')}
            </div>
          </section>

          <!-- 志望試験ステータス一覧 -->
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70">
            <div class="flex items-center justify-between mb-3">
              <h2 class="text-sm font-bold text-navy-900">志望試験の1次日程（${targetExams.length}区分）</h2>
              <button type="button" data-goto="schedule" class="goto-tab-btn text-xs font-semibold text-blue-600 hover:underline">日程編集へ</button>
            </div>
            ${targetExams.length === 0 ? `
              <p class="text-xs text-slate-400 text-center py-4">志望区分が選択されていません。「区分・設定」から選べます。</p>
            ` : `
              <div class="divide-y divide-slate-100">
                ${targetExams.map(({ master, user }) => {
                  const days = getDaysUntil(user.firstExamDate);
                  const badge = user.firstExamDate
                    ? (days >= 0
                      ? `<span class="px-2.5 py-1 rounded-full bg-blue-50 text-blue-700 text-[11px] font-bold">あと${days}日</span>`
                      : `<span class="px-2.5 py-1 rounded-full bg-slate-100 text-slate-500 text-[11px] font-bold">終了</span>`)
                    : `<span class="px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200/80 text-[11px] font-bold">日程未定</span>`;
                  return `
                    <div class="py-2.5 flex items-center justify-between gap-2">
                      <div class="min-w-0">
                        <p class="text-xs font-bold text-slate-800 truncate">${escapeHtml(master.shortName)}</p>
                        <p class="text-[11px] text-slate-500 mt-0.5">${user.firstExamDate ? formatDateShort(user.firstExamDate) : '受験案内公表後に手動設定可能'}</p>
                      </div>
                      <div class="shrink-0 flex items-center gap-1.5">
                        ${badge}
                        <button type="button" data-edit-exam="${master.id}" class="home-edit-exam-btn p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50" aria-label="編集">
                          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                        </button>
                      </div>
                    </div>
                  `;
                }).join('')}
              </div>
            `}
          </section>

          <!-- 直近のマイ予定 -->
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70">
            <div class="flex items-center justify-between mb-2.5">
              <h2 class="text-sm font-bold text-navy-900">直近のマイ予定</h2>
              <button type="button" data-goto="schedule" class="goto-tab-btn text-xs font-semibold text-blue-600 hover:underline">予定管理へ</button>
            </div>
            ${upcomingEvents.length === 0 ? `
              <div class="text-center py-4 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
                <p class="text-xs text-slate-400">登録されている予定はまだありません（0件）</p>
                <button type="button" id="homeQuickAddEventBtn" class="mt-2 px-3 py-1.5 rounded-xl bg-white border border-slate-200 text-xs font-semibold text-blue-600 hover:bg-blue-50">＋ 模試・説明会などを追加</button>
              </div>
            ` : `
              <div class="space-y-2">
                ${upcomingEvents.map(ev => `
                  <div class="flex items-center justify-between gap-2 bg-slate-50 rounded-2xl px-3 py-2.5">
                    <div class="min-w-0">
                      <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-md bg-blue-100 text-blue-700 mr-1">${escapeHtml(ev.category)}</span>
                      <span class="text-xs font-semibold text-slate-800">${escapeHtml(ev.title)}</span>
                    </div>
                    <span class="text-[11px] font-medium text-slate-500 shrink-0">${ev.date ? formatDateShort(ev.date) : '日付なし'}</span>
                  </div>
                `).join('')}
              </div>
            `}
          </section>
        </div>
      `;
    }

    function bindHomeEvents() {
      document.querySelectorAll('.goto-tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.activeTab = btn.dataset.goto;
          renderApp();
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
      document.querySelectorAll('.home-edit-exam-btn').forEach(btn => {
        btn.addEventListener('click', () => openExamEditModal(btn.dataset.editExam));
      });
      const addEvBtn = document.getElementById('homeQuickAddEventBtn');
      if (addEvBtn) addEvBtn.addEventListener('click', () => openEventModal());

      const quickBackupBtn = document.getElementById('bannerQuickBackupBtn');
      if (quickBackupBtn) quickBackupBtn.addEventListener('click', exportBackupJson);

      const dismissBtn = document.getElementById('bannerDismissBtn');
      if (dismissBtn) {
        dismissBtn.addEventListener('click', () => {
          uiState.dismissedBackupBanner = true;
          renderApp();
        });
      }
    }

    /* -------------------------------------------------------------------------
       6-2. 学習・章別進捗タブ
       ------------------------------------------------------------------------- */
    function renderStudyTab() {
      const q = computeOverallProgressAndQuotas();
      const targetSubjectSet = getTargetExamSubjectNameSet();

      const filtered = appState.subjects.filter(s => {
        if (uiState.studyFilter === '教養' && s.category !== '教養') return false;
        if (uiState.studyFilter === '専門' && s.category !== '専門') return false;
        if (uiState.studyFilter === 'target' && !targetSubjectSet.has(s.name)) return false;
        if (uiState.studySearch.trim()) {
          const kw = uiState.studySearch.trim().toLowerCase();
          const hitSub = s.name.toLowerCase().includes(kw);
          const hitCh = (s.chapters || []).some(c => c.title.toLowerCase().includes(kw));
          if (!hitSub && !hitCh) return false;
        }
        return true;
      });

      const filters = [
        { id: 'all', label: `すべて (${appState.subjects.length})` },
        { id: 'target', label: '志望対象' },
        { id: '教養', label: '教養' },
        { id: '専門', label: '専門' }
      ];

      return `
        <div class="space-y-4">
          ${renderPeriodQuotaCard(q, true)}

          <!-- フィルタ＆検索バー -->
          <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/70 space-y-2.5">
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
              ${filters.map(f => `
                <button type="button" data-study-filter="${f.id}" class="study-filter-btn shrink-0 px-3 py-1.5 rounded-xl text-xs font-bold transition-colors ${uiState.studyFilter === f.id ? 'bg-navy-900 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">${f.label}</button>
              `).join('')}
            </div>
            <div class="relative">
              <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input type="text" id="studySearchInput" value="${escapeHtml(uiState.studySearch)}" placeholder="科目名・章タイトルで検索..." class="w-full pl-9 pr-3 py-2 rounded-xl bg-slate-100/80 border border-transparent focus:border-blue-400 focus:bg-white text-xs outline-none transition-all">
            </div>
          </div>

          <!-- 科目カードリスト -->
          <div class="space-y-3" id="subjectCardList">
            ${filtered.length === 0 ? `
              <div class="bg-white rounded-3xl p-8 text-center border border-slate-200/70">
                <p class="text-sm font-semibold text-slate-500">該当する科目がありません</p>
                <button type="button" id="emptyAddSubjectBtn" class="mt-3 px-4 py-2 rounded-xl bg-blue-600 text-white text-xs font-bold">＋ 新しい科目を追加</button>
              </div>
            ` : filtered.map(sub => renderSubjectCard(sub, targetSubjectSet.has(sub.name))).join('')}
          </div>
        </div>
      `;
    }

    function renderSubjectCard(sub, isTargetNeeded) {
      const st = getSubjectStats(sub);
      const isExpanded = uiState.expandedSubjectIds.has(sub.id);
      const chCount = (sub.chapters || []).length;
      const catBadge = sub.category === '教養'
        ? 'bg-blue-50 text-blue-700 border-blue-200/70'
        : 'bg-indigo-50 text-indigo-700 border-indigo-200/70';

      return `
        <article class="bg-white rounded-3xl shadow-sm border border-slate-200/75 overflow-hidden transition-all">
          <div class="p-4">
            <!-- 科目ヘッダー -->
            <div class="flex items-start justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center flex-wrap gap-1.5 mb-1">
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-md border ${catBadge}">${sub.category}</span>
                  ${isTargetNeeded ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200/70">志望対象</span>` : ''}
                  ${st.hasChapters ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600">章合算中 (${chCount}章)</span>` : ''}
                </div>
                <h3 class="text-sm font-bold text-navy-900 leading-snug">${escapeHtml(sub.name)}</h3>
                ${sub.memo ? `<p class="text-[11px] text-slate-400 mt-0.5 truncate">${escapeHtml(sub.memo)}</p>` : ''}
              </div>
              <div class="flex items-center gap-1 shrink-0">
                <button type="button" data-edit-sub="${sub.id}" class="sub-edit-btn p-2 rounded-xl text-slate-400 hover:text-blue-600 hover:bg-blue-50 transition-colors" aria-label="科目を編集">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
              </div>
            </div>

            <!-- 進捗バー -->
            <div class="mt-3">
              <div class="flex items-baseline justify-between text-xs mb-1.5">
                <span class="font-bold text-slate-700">
                  ${st.done.toLocaleString()} <span class="font-normal text-slate-400">/ ${st.target.toLocaleString()} ${escapeHtml(sub.unit)}</span>
                </span>
                <span class="font-extrabold ${st.pct === 100 ? 'text-emerald-600' : 'text-blue-600'}">${st.pct}%</span>
              </div>
              <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="${st.pct === 100 ? 'bg-emerald-500' : 'bg-blue-600'} h-full rounded-full transition-all duration-300" style="width:${st.pct}%"></div>
              </div>
            </div>

            <!-- 操作エリア（親ダイレクト操作 or 章展開ボタン） -->
            <div class="mt-3.5 flex items-center justify-between gap-2 flex-wrap">
              ${st.hasChapters ? `
                <span class="text-[11px] text-slate-500 bg-slate-50 px-2.5 py-1.5 rounded-xl border border-slate-200/70">下の「章別管理」から各章を記録</span>
              ` : `
                <div class="flex items-center gap-1.5">
                  <button type="button" data-sub-delta="${sub.id}:-1" class="sub-delta-btn w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-xs font-bold transition-all">-1</button>
                  <button type="button" data-sub-delta="${sub.id}:1" class="sub-delta-btn px-3 h-9 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-xs font-bold shadow-sm transition-all">+1</button>
                  <button type="button" data-sub-delta="${sub.id}:5" class="sub-delta-btn px-3 h-9 rounded-xl bg-navy-800 hover:bg-navy-900 active:scale-95 text-white text-xs font-bold shadow-sm transition-all">+5</button>
                </div>
              `}

              <button type="button" data-toggle-ch="${sub.id}" class="toggle-ch-btn px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 transition-colors ${isExpanded ? 'bg-blue-50 text-blue-700 border border-blue-200' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'}">
                <svg class="w-3.5 h-3.5 transition-transform ${isExpanded ? 'rotate-180' : ''}" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
                <span>章別管理${chCount > 0 ? ` (${chCount})` : ''}</span>
              </button>
            </div>
          </div>

          <!-- 折りたたみ式：章別進捗パネル -->
          ${isExpanded ? `
            <div class="bg-slate-50/90 border-t border-slate-200/80 p-3.5 space-y-3">
              <div class="flex items-center justify-between gap-2 flex-wrap">
                <span class="text-[11px] font-bold text-navy-900">章ごとの進捗（単位：${escapeHtml(sub.unit)}）</span>
                <div class="flex items-center gap-1.5">
                  <button type="button" data-bulk-ch="${sub.id}" class="bulk-ch-btn px-2.5 py-1.5 rounded-xl bg-white border border-blue-200 text-blue-700 hover:bg-blue-50 text-[11px] font-bold shadow-xs transition-colors">章を一括生成</button>
                  <button type="button" data-add-ch="${sub.id}" class="add-ch-btn px-2.5 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-[11px] font-bold shadow-xs transition-colors">＋ 章を追加</button>
                </div>
              </div>

              ${chCount === 0 ? `
                <div class="bg-white rounded-2xl p-4 text-center border border-dashed border-slate-300">
                  <p class="text-xs text-slate-500">まだ章が登録されていません。</p>
                  <p class="text-[11px] text-slate-400 mt-1">「章を一括生成」で第1章〜第10章をワンタップ作成できます。章を作ると親科目の合計へ自動合算されます。</p>
                </div>
              ` : `
                <div class="space-y-2">
                  ${sub.chapters.map(ch => {
                    const chTarget = Math.max(1, Number(ch.target) || 1);
                    const chDone = Math.max(0, Math.min(Number(ch.done) || 0, chTarget));
                    const chPct = Math.min(100, Math.round((chDone / chTarget) * 100));
                    const isComplete = chDone >= chTarget;
                    return `
                      <div class="bg-white rounded-2xl p-3 border ${isComplete ? 'border-emerald-200 bg-emerald-50/30' : 'border-slate-200/80'} shadow-2xs">
                        <div class="flex items-start justify-between gap-2">
                          <div class="min-w-0 flex-1">
                            <p class="text-xs font-bold text-slate-800 leading-snug break-words">${escapeHtml(ch.title)}</p>
                            <p class="text-[11px] text-slate-500 mt-0.5">${chDone} / ${chTarget} ${escapeHtml(sub.unit)} <span class="font-bold ${isComplete ? 'text-emerald-600' : 'text-blue-600'} ml-1">${chPct}%</span></p>
                          </div>
                          <div class="flex items-center gap-1 shrink-0">
                            <button type="button" data-edit-ch="${sub.id}:${ch.id}" class="edit-ch-btn p-1.5 rounded-lg text-slate-400 hover:text-blue-600 hover:bg-blue-50" aria-label="章を編集">
                              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                            </button>
                            <button type="button" data-del-ch="${sub.id}:${ch.id}" class="del-ch-btn p-1.5 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-rose-50" aria-label="章を削除">
                              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                            </button>
                          </div>
                        </div>
                        <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden my-2">
                          <div class="${isComplete ? 'bg-emerald-500' : 'bg-blue-500'} h-full rounded-full transition-all duration-300" style="width:${chPct}%"></div>
                        </div>
                        <div class="flex items-center justify-end gap-1.5">
                          <button type="button" data-ch-act="${sub.id}:${ch.id}:-1" class="ch-act-btn px-2.5 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 active:scale-95 text-slate-700 text-[11px] font-bold">-1</button>
                          <button type="button" data-ch-act="${sub.id}:${ch.id}:1" class="ch-act-btn px-2.5 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-700 active:scale-95 text-white text-[11px] font-bold">+1</button>
                          <button type="button" data-ch-act="${sub.id}:${ch.id}:5" class="ch-act-btn px-2.5 py-1.5 rounded-lg bg-navy-800 hover:bg-navy-900 active:scale-95 text-white text-[11px] font-bold">+5</button>
                          <button type="button" data-ch-act="${sub.id}:${ch.id}:complete" class="ch-act-btn px-2.5 py-1.5 rounded-lg ${isComplete ? 'bg-emerald-100 text-emerald-700' : 'bg-emerald-600 hover:bg-emerald-700 text-white'} active:scale-95 text-[11px] font-bold">${isComplete ? '完了済' : '完了'}</button>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              `}
            </div>
          ` : ''}
        </article>
      `;
    }

    function bindStudyEvents() {
      document.querySelectorAll('.study-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.studyFilter = btn.dataset.studyFilter;
          renderApp();
        });
      });

      const searchInput = document.getElementById('studySearchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          uiState.studySearch = e.target.value;
          // 検索入力のフォーカスを維持するため、リスト部分のみ再描画
          const targetSubjectSet = getTargetExamSubjectNameSet();
          const filtered = appState.subjects.filter(s => {
            if (uiState.studyFilter === '教養' && s.category !== '教養') return false;
            if (uiState.studyFilter === '専門' && s.category !== '専門') return false;
            if (uiState.studyFilter === 'target' && !targetSubjectSet.has(s.name)) return false;
            if (uiState.studySearch.trim()) {
              const kw = uiState.studySearch.trim().toLowerCase();
              return s.name.toLowerCase().includes(kw) || (s.chapters || []).some(c => c.title.toLowerCase().includes(kw));
            }
            return true;
          });
          const listEl = document.getElementById('subjectCardList');
          if (listEl) {
            listEl.innerHTML = filtered.length === 0
              ? `<div class="bg-white rounded-3xl p-8 text-center border border-slate-200/70"><p class="text-sm font-semibold text-slate-500">該当する科目がありません</p></div>`
              : filtered.map(sub => renderSubjectCard(sub, targetSubjectSet.has(sub.name))).join('');
            bindSubjectCardInnerEvents();
          }
        });
      }

      const emptyAddBtn = document.getElementById('emptyAddSubjectBtn');
      if (emptyAddBtn) emptyAddBtn.addEventListener('click', () => openSubjectEditModal(null));

      bindSubjectCardInnerEvents();
    }

    function bindSubjectCardInnerEvents() {
      // 科目編集
      document.querySelectorAll('.sub-edit-btn').forEach(btn => {
        btn.addEventListener('click', () => openSubjectEditModal(btn.dataset.editSub));
      });

      // 親科目の直接カウント操作（章がない場合）
      document.querySelectorAll('.sub-delta-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const [subId, deltaStr] = btn.dataset.subDelta.split(':');
          const delta = Number(deltaStr);
          const sub = appState.subjects.find(s => s.id === subId);
          if (!sub) return;
          const prev = Number(sub.done) || 0;
          const next = Math.max(0, Math.min(sub.target, prev + delta));
          const actualDelta = next - prev;
          if (actualDelta !== 0) {
            sub.done = next;
            recordDailyDelta(actualDelta);
            saveState();
            renderApp();
          }
        });
      });

      // 章別パネル折りたたみ切替
      document.querySelectorAll('.toggle-ch-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.toggleCh;
          if (uiState.expandedSubjectIds.has(id)) {
            uiState.expandedSubjectIds.delete(id);
          } else {
            uiState.expandedSubjectIds.add(id);
          }
          renderApp();
        });
      });

      // 章の一括生成
      document.querySelectorAll('.bulk-ch-btn').forEach(btn => {
        btn.addEventListener('click', () => openBulkChapterModal(btn.dataset.bulkCh));
      });

      // 個別章の追加
      document.querySelectorAll('.add-ch-btn').forEach(btn => {
        btn.addEventListener('click', () => openChapterEditModal(btn.dataset.addCh, null));
      });

      // 個別章の編集
      document.querySelectorAll('.edit-ch-btn').forEach(btn => {
        const [subId, chId] = btn.dataset.editCh.split(':');
        btn.addEventListener('click', () => openChapterEditModal(subId, chId));
      });

      // 個別章の削除
      document.querySelectorAll('.del-ch-btn').forEach(btn => {
        const [subId, chId] = btn.dataset.delCh.split(':');
        btn.addEventListener('click', () => {
          const sub = appState.subjects.find(s => s.id === subId);
          const ch = sub?.chapters.find(c => c.id === chId);
          if (!sub || !ch) return;
          openConfirmModal({
            title: '章を削除しますか？',
            message: `「${ch.title}」を削除します。この章の記録分も親科目の合計から差し引かれます。`,
            confirmLabel: '削除する',
            danger: true,
            onConfirm: () => {
              sub.chapters = sub.chapters.filter(c => c.id !== chId);
              saveState();
              showToast('章を削除しました');
              renderApp();
            }
          });
        });
      });

      // 章のクイック進捗操作（-1 / +1 / +5 / 完了）
      document.querySelectorAll('.ch-act-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const [subId, chId, act] = btn.dataset.chAct.split(':');
          const sub = appState.subjects.find(s => s.id === subId);
          const ch = sub?.chapters.find(c => c.id === chId);
          if (!sub || !ch) return;
          const prev = Number(ch.done) || 0;
          let next = prev;
          if (act === 'complete') {
            next = ch.target;
          } else {
            next = Math.max(0, Math.min(ch.target, prev + Number(act)));
          }
          const actualDelta = next - prev;
          if (actualDelta !== 0) {
            ch.done = next;
            recordDailyDelta(actualDelta);
            saveState();
            renderApp();
          }
        });
      });
    }

              <input type="number" min="1" id="subFormTarget" value="${existing ? existing.target : 100}" ${hasCh ? 'disabled' : ''} class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 focus:border-blue-500 outline-none text-sm ${hasCh ? 'bg-slate-100 text-slate-400' : ''}">

            <div>

        footerHtml: `
          ${isEdit ? `<button type="button" id="subFormDeleteBtn" class="mr-auto px-3.5 py-2.5 rounded-xl bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-bold">削除</button>` : ''}
          <button type="button" id="subFormCancelBtn" class="px-4 py-2.5 rounded-xl bg-slate-200/80 text-slate-700 text-sm font-semibold">キャンセル</button>
          <button type="button" id="subFormSaveBtn" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold">保存</button>
        `,
        onOpen: () => {
          document.getElementById('subFormCancelBtn').addEventListener('click', closeModal);
          document.getElementById('subFormSaveBtn').addEventListener('click', () => {
            const name = document.getElementById('subFormName').value.trim();
            if (!name) {
              showToast('科目名を入力してください', 'error');
              return;
            }
            const cat = document.getElementById('subFormCat').value;
            const unit = document.getElementById('subFormUnit').value;
            const target = Math.max(1, Number(document.getElementById('subFormTarget').value) || 100);
            const memo = document.getElementById('subFormMemo').value.trim();

            if (isEdit) {
              existing.name = name;
              existing.category = cat;
              existing.unit = unit;
              if (!hasCh) {
                existing.target = target;
                existing.done = Math.min(existing.done, target);
              }
              existing.memo = memo;
              showToast('科目を更新しました');
            } else {
              appState.subjects.push({
                id: uid('sub'),
                name,
                category: cat,
                unit,
                target,

        `,
        footerHtml: `
          <button type="button" id="bulkCancelBtn" class="px-4 py-2.5 rounded-xl bg-slate-200/80 text-slate-700 text-sm font-semibold">キャンセル</button>
          <button type="button" id="bulkCreateBtn" class="px-5 py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold">一括生成する</button>
        `,
        onOpen: () => {
          document.getElementById('bulkCancelBtn').addEventListener('click', closeModal);

            const count = Math.max(1, Math.min(50, Number(document.getElementById('bulkCount').value) || 10));

      if (!sub) return;

    function bindScheduleEvents() {
      document.querySelectorAll('.sched-filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.scheduleFilter = btn.dataset.schedFilter;
          renderApp();
        });
      });

      document.querySelectorAll('.toggle-target-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.toggleTarget;
          if (!appState.exams[id]) return;
          appState.exams[id].isTarget = !appState.exams[id].isTarget;
          appState.hasEditedSchedule = true;
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.sched-edit-exam-btn').forEach(btn => {
        btn.addEventListener('click', () => openExamEditModal(btn.dataset.editExam));
      });

      const addEvBtn = document.getElementById('schedAddEventBtn');
      if (addEvBtn) addEvBtn.addEventListener('click', () => openEventModal());

      document.querySelectorAll('.ev-toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const ev = appState.myEvents.find(e => e.id === btn.dataset.toggleEv);
          if (!ev) return;
          ev.done = !ev.done;
          saveState();
          renderApp();
        });
      });

      document.querySelectorAll('.ev-del-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          appState.myEvents = appState.myEvents.filter(e => e.id !== btn.dataset.delEv);
          saveState();
          showToast('予定を削除しました');
          renderApp();
        });
      });
    }

                  <div class="shrink-0 w-56 bg-white rounded-2xl p-3 border border-slate-200/80 shadow-2xs">
                    <div class="flex items-center justify-between gap-1 mb-1.5">
                      <span class="text-xs font-extrabold text-navy-900 truncate">${escapeHtml(m.shortName)}</span>
                      ${appState.exams[m.id]?.isTarget ? `<span class="text-[10px] font-bold text-blue-600">★志望</span>` : ''}
                    </div>
                    <div class="space-y-1 text-[11px]">
                      <div class="bg-blue-50/70 rounded-lg px-2 py-1 text-slate-700">
                        <span class="font-bold text-blue-700">教養：</span>${escapeHtml(m.reqSummary.kyoyo)}
                      </div>
                      <div class="bg-indigo-50/70 rounded-lg px-2 py-1 text-slate-700">
                        <span class="font-bold text-indigo-700">専門：</span>${escapeHtml(m.reqSummary.senmon)}
                      </div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </section>

            <!-- 科目比較マトリクス（左端列sticky固定＋必要科目数ヘッダー付き） -->
            <section class="bg-white rounded-3xl shadow-sm border border-slate-200/80 overflow-hidden">
              <div class="px-4 py-2.5 bg-slate-50 border-b border-slate-200/80 flex items-center justify-between text-[11px] text-slate-500">
                <span class="font-bold text-navy-900">科目比較マトリクス表</span>
                <span>← 横にスクロールできます →</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full border-collapse text-left">
                  <thead>
                    <tr class="bg-navy-900 text-white align-top">
                      <th class="sticky left-0 z-20 bg-navy-900 px-3 py-3 text-xs font-bold min-w-[116px] sticky-col-shadow border-r border-white/10">
                        科目名
                      </th>
                      ${examsToShow.map(m => `
                        <th class="px-2.5 py-2.5 text-center min-w-[118px] border-r border-white/10 last:border-r-0">
                          <div class="text-xs font-extrabold leading-tight">${escapeHtml(m.shortName)}</div>
                          <div class="mt-1.5 space-y-1 text-[9.5px] font-medium leading-tight text-left">
                            <div class="bg-white/12 rounded px-1.5 py-1 text-blue-100">教:${escapeHtml(m.reqSummary.kyoyo)}</div>
                            <div class="bg-white/12 rounded px-1.5 py-1 text-indigo-100">専:${escapeHtml(m.reqSummary.senmon)}</div>
                          </div>
                        </th>
                      `).join('')}
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100">
                    ${rowsToShow.map(row => `
                      <tr class="hover:bg-blue-50/30 transition-colors">
                        <td class="sticky left-0 z-10 bg-white px-3 py-2.5 sticky-col-shadow border-r border-slate-100">
                          <span class="inline-block text-[9px] font-bold px-1.5 py-0.5 rounded ${row.cat === '教養' ? 'bg-blue-50 text-blue-700' : 'bg-indigo-50 text-indigo-700'} mb-0.5">${row.cat}</span>
                          <div class="text-xs font-bold text-slate-800 leading-tight">${escapeHtml(row.name)}</div>
                        </td>
                        ${examsToShow.map(m => `
                          <td class="px-2 py-2.5 text-center border-r border-slate-100/80 last:border-r-0 whitespace-nowrap">
                            ${cellBadge(row.map[m.id])}
                          </td>
                        `).join('')}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </section>
          `}
        </div>
      `;
    }

    function bindGuideEvents() {
      document.querySelectorAll('.guide-sub-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.guideSubTab = btn.dataset.guideSub;
          renderApp();
        });
      });

      document.querySelectorAll('.guide-exam-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.selectedGuideExamId = btn.dataset.selectGuide;
          renderApp();
        });
      });

      const guideTargetBtn = document.getElementById('guideToggleTargetBtn');
      if (guideTargetBtn) {
        guideTargetBtn.addEventListener('click', () => {
          const u = appState.exams[uiState.selectedGuideExamId];
          if (!u) return;
          u.isTarget = !u.isTarget;
          appState.hasEditedSchedule = true;
          saveState();
          renderApp();
        });
      }

      const guideEditSchedBtn = document.getElementById('guideEditScheduleBtn');
      if (guideEditSchedBtn) {
        guideEditSchedBtn.addEventListener('click', () => openExamEditModal(uiState.selectedGuideExamId));
      }

      const matrixToggle = document.getElementById('matrixTargetToggle');
      if (matrixToggle) {
        matrixToggle.addEventListener('change', (e) => {
          uiState.matrixTargetOnly = e.target.checked;
          renderApp();
        });
      }

      document.querySelectorAll('.matrix-cat-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          uiState.matrixCategory = btn.dataset.matrixCat;
          renderApp();
        });
      });
    }

    /* -------------------------------------------------------------------------
       6-5. 区分・設定タブ
       ------------------------------------------------------------------------- */
    function renderSettingsTab() {
      const lastBackupText = appState.lastBackupAt
        ? new Date(appState.lastBackupAt).toLocaleString('ja-JP')
        : 'まだバックアップ保存されていません';

      return `
        <div class="space-y-4">
          <!-- 志望区分の選択 -->
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70">
            <h2 class="text-sm font-bold text-navy-900">志望試験区分の選択</h2>
            <p class="text-[11px] text-slate-500 mt-0.5 mb-3">チェックを入れた区分がホーム・日程重複チェック・「志望のみ」フィルタの対象になります。</p>
            <div class="space-y-2">
              ${EXAM_MASTER.map(m => {
                const u = appState.exams[m.id];
                return `
                  <label class="flex items-center justify-between gap-3 p-3 rounded-2xl border ${u.isTarget ? 'bg-blue-50/50 border-blue-200' : 'bg-slate-50/70 border-slate-200/70'} cursor-pointer transition-colors">
                    <div class="min-w-0">
                      <p class="text-xs font-bold text-navy-900 truncate">${escapeHtml(m.name)}</p>
                      <p class="text-[11px] text-slate-500 mt-0.5">1次：${u.firstExamDate ? formatDateShort(u.firstExamDate) : '日程未定 (TBD)'}</p>
                    </div>
                    <input type="checkbox" data-setting-target="${m.id}" ${u.isTarget ? 'checked' : ''} class="setting-target-chk w-5 h-5 rounded accent-blue-600 shrink-0">
                  </label>
                `;
              }).join('')}
            </div>
          </section>

          <!-- 目標基準日設定 -->
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70 space-y-2.5">
            <div>
              <h2 class="text-sm font-bold text-navy-900">予備の目標基準日（期間ノルマ計算用）</h2>
              <p class="text-[11px] text-slate-500 mt-0.5">志望試験に確定日がある場合は直近の試験日が自動採用されます。未定試験のみ志望している場合、この日付を基準にノルマを自動換算します。</p>
            </div>
            <div class="flex items-center gap-2">
              <input type="date" id="fallbackGoalDateInput" value="${escapeHtml(appState.fallbackGoalDate)}" class="flex-1 px-3.5 py-2.5 rounded-xl border border-slate-200 text-sm bg-white">
              <button type="button" id="saveFallbackGoalBtn" class="px-4 py-2.5 rounded-xl bg-navy-900 hover:bg-navy-800 text-white text-xs font-bold">適用</button>
            </div>
          </section>

          <!-- バックアップ保存＆復元 -->
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-slate-200/70 space-y-3">
            <div>
              <h2 class="text-sm font-bold text-navy-900">データバックアップ＆復元（JSON）</h2>
              <p class="text-[11px] text-slate-500 mt-1 leading-relaxed">データは端末のSafari内部に自動保存されます。履歴消去や7日以上の放置によるデータ消失に備え、週1回程度のバックアップ保存をおすすめします。</p>
            </div>
            <div class="bg-slate-50 rounded-2xl px-3.5 py-2.5 border border-slate-200/70 text-[11px] text-slate-600">
              最終バックアップ：<strong class="text-navy-900">${escapeHtml(lastBackupText)}</strong>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <button type="button" id="btnExportBackup" class="w-full py-3 px-4 rounded-2xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-sm flex items-center justify-center gap-2 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                <span>バックアップ保存</span>
              </button>
              <button type="button" id="btnImportBackup" class="w-full py-3 px-4 rounded-2xl bg-white hover:bg-slate-50 text-navy-900 border border-slate-300 text-xs font-bold flex items-center justify-center gap-2 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                <span>バックアップ復元</span>
              </button>
            </div>
          </section>

          <!-- iPhone ホーム画面追加ガイド -->
          <section class="bg-blue-50/70 rounded-3xl p-4 border border-blue-200/70 space-y-1.5">
            <h2 class="text-xs font-extrabold text-navy-900">iPhoneアプリとして使うヒント</h2>
            <p class="text-[11px] text-slate-600 leading-relaxed">
              Safari下部の「共有ボタン（□に↑）」→「ホーム画面に追加」を選ぶと、全画面のアプリとして起動できます。
            </p>
          </section>

          <!-- 全データ初期化 -->
          <section class="bg-white rounded-3xl p-4 shadow-sm border border-rose-200/80 space-y-2.5">
            <h2 class="text-sm font-bold text-rose-700">全データの初期化</h2>
            <p class="text-[11px] text-slate-500">すべての学習進捗・章データ・予定・日程編集を「0（初期状態）」にリセットします。</p>
            <button type="button" id="btnResetAll" class="w-full py-2.5 rounded-2xl bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-bold transition-colors">すべてのデータを初期状態に戻す</button>
          </section>
        </div>
      `;
    }

    function bindSettingsEvents() {
      document.querySelectorAll('.setting-target-chk').forEach(chk => {
        chk.addEventListener('change', (e) => {
          const id = e.target.dataset.settingTarget;
          if (!appState.exams[id]) return;
          appState.exams[id].isTarget = e.target.checked;
          appState.hasEditedSchedule = true;
          saveState();
          renderApp();
        });
      });

      document.getElementById('saveFallbackGoalBtn').addEventListener('click', () => {
        const val = document.getElementById('fallbackGoalDateInput').value;
        if (!val) {
          showToast('日付を選択してください', 'error');
          return;
        }
        appState.fallbackGoalDate = val;
        saveState();
        showToast('予備の目標基準日を保存しました');
        renderApp();
      });

      document.getElementById('btnExportBackup').addEventListener('click', exportBackupJson);
      document.getElementById('btnImportBackup').addEventListener('click', () => {
        document.getElementById('importFileInput').click();
      });

      document.getElementById('btnResetAll').addEventListener('click', () => {
        openConfirmModal({
          title: '全データを初期化しますか？',
          message: 'すべての学習記録・章データ・マイ予定・手動編集した日程がリセットされ、初期状態（すべて0）に戻ります。\n必要であれば先にバックアップを保存してください。',
          confirmLabel: '初期化する',
          danger: true,
          onConfirm: () => {
            appState = createInitialState();
            uiState.expandedSubjectIds.clear();
            uiState.dismissedBackupBanner = false;
            saveState();
            showToast('すべてのデータを初期化しました');
            renderApp();
          }
        });
      });
    }

    /* =========================================================================
       7. ナビゲーション初期化＆初回起動
       ========================================================================= */
    document.querySelectorAll('#bottomNav .nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        if (uiState.activeTab === tab) return;
        uiState.activeTab = tab;
        renderApp();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    // 初回描画
    renderApp();
  </script>
</body>
</html>
